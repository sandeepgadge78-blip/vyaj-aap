<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://sandeepgadge78-blip.github.io; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://docs.google.com https://*.googleusercontent.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com;" />
  <title>Hishob — व्याज व कर्ज हिशोब (V12.0)</title>

  <link rel="manifest" href="./manifest.json" />

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --card-2: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 64px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .brand { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--accent);
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, input, select {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
    }
    button { cursor: pointer; font-weight: 600; transition: 0.15s; }
    button:hover { border-color: var(--accent); }
    button.primary { background: #0284c7; border-color: #0ea5e9; color: #fff; }
    button.success { background: #15803d; border-color: #22c55e; color: #fff; }
    button.danger { background: #991b1b; border-color: #ef4444; color: #fff; }
    button.warn { background: #92400e; border-color: #f59e0b; color: #fff; }
    .container { max-width: 980px; margin: 16px auto; padding: 0 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .borrower-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      background: rgba(30, 41, 59, 0.45);
      line-height: 1.5;
    }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .ok { color: var(--accent-2); }
    .audit-box {
      max-height: 220px;
      overflow-y: auto;
      font-size: 0.82rem;
      background: var(--bg);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    #authScreen {
      max-width: 420px;
      margin: 48px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Hishob V12.0</span>
      <span id="syncStatus" class="badge">Offline / Ready</span>
    </div>
    <div id="topActions" class="row hidden">
      <span id="userEmailBadge" class="muted"></span>
      <select id="autoLockSelect" title="Auto-lock वेळ">
        <option value="300000">Auto-lock: 5 min</option>
        <option value="600000">Auto-lock: 10 min</option>
        <option value="900000">Auto-lock: 15 min</option>
      </select>
      <button id="lockBtn" class="danger" title="लॉक व साइन-आउट">🔒 लॉक / लॉगआउट</button>
    </div>
  </header>

  <div id="authScreen">
    <h2 style="margin-top:0;">व्याज हिशोब लॉगिन</h2>
    <p class="muted">केवळ अधिकृत खात्यासाठी सुरक्षित प्रवेश.</p>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <input type="email" id="loginEmail" placeholder="तुमचा Gmail पत्ता" autocomplete="username" />
      <input type="password" id="loginPassword" placeholder="पासवर्ड" autocomplete="current-password" />
      <button id="emailLoginBtn" class="primary">ईमेल/पासवर्डने लॉगिन करा</button>
      <button id="googleLoginBtn" class="success">Google Sign-In</button>
      <div id="authMsg" class="muted"></div>
    </div>
  </div>

  <main id="appScreen" class="container hidden">

    <section class="card">
      <h3 style="margin-top:0;">नवीन ग्राहक / कर्ज नोंद</h3>
      <div class="grid-3">
        <input type="text" id="bName" placeholder="ग्राहकाचे नाव" />
        <input type="number" id="bPrincipal" placeholder="मुद्दल रक्कम (₹)" min="0" />
        <input type="number" id="bRate" placeholder="मासिक व्याज दर (%)" step="0.1" value="2" />
        <input type="month" id="bStartYm" />
        <input type="number" id="bCustomDue" placeholder="सुरुवातीची मॅन्युअल मागील बाकी (₹)" min="0" />
      </div>
      <div style="margin-top:10px;">
        <button id="addBorrowerBtn" class="primary">+ ग्राहक जोडा</button>
      </div>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between;">
        <h3 style="margin:0;">मासिक हिशोब व जमा नोंद</h3>
        <div class="row">
          <input type="text" id="searchInput" placeholder="नाव शोधा..." style="width:160px;" />
          <label class="muted">महिना:</label>
          <input type="month" id="activeYm" />
        </div>
      </div>
      <div id="borrowersList"></div>
    </section>

    <section class="card">
      <h3 style="margin-top:0;">Google Sheet Import व Encrypted Backup</h3>
      <div class="row" style="margin-bottom:10px;">
        <input type="text" id="sheetUrlInput" placeholder="Google Sheet CSV / Export URL किंवा Sheet ID" style="flex:1; min-width:220px;" />
        <button id="importSheetBtn" class="primary">Sheet Import</button>
      </div>
      <div class="row">
        <input type="password" id="backupPasskey" placeholder="मजबूत Passkey (किमान 6 अक्षरे)" />
        <button id="exportEncBtn" class="success">Encrypted Backup Export</button>
        <input type="file" id="importEncFile" accept=".json,.txt" />
        <button id="importEncBtn">Encrypted Restore</button>
      </div>
      <div id="ioMsg" class="muted" style="margin-top:8px;"></div>
    </section>

    <section class="card">
      <h3 style="margin-top:0;">Audit Log (केवळ नवीन नोंद)</h3>
      <div id="auditList" class="audit-box"></div>
    </section>

  </main>

  <script src="./app.js"></script>
</body>
</html>
