<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090a0d" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://sandeepgadge78-blip.github.io; script-src 'self' https://www.gstatic.com https://apis.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.googleusercontent.com https://api.qrserver.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://fcmregistrations.googleapis.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com;" />
  <title>व्याज हिशोब वही — Vyaj Infinity X</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.png" />
  <link rel="stylesheet" href="./css/design-system.css?v=2.0" />
  <link rel="stylesheet" href="./css/print-a4.css?v=2.0" />

  <!-- Firebase Compat SDKs (विद्यमान hishob-4b548 डेटाबेसशी १००% सुसंगत) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splashScreen">
    <div class="splash-logo">💎</div>
    <div class="splash-title">व्याज हिशोब वही</div>
    <div class="splash-sub">Vyaj Infinity X • Adaptive Banking Core</div>
  </div>

  <!-- A4 Print साठी स्वच्छ क्षेत्र -->
  <div id="printArea"></div>

  <!-- लॉगिन स्क्रीन -->
  <section id="authScreen" class="hidden">
    <h2 style="margin:0 0 4px;">व्याज हिशोब लॉगिन</h2>
    <p class="muted" style="margin:0 0 14px;">केवळ अधिकृत खात्यासाठी सुरक्षित प्रवेश.</p>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <input type="email" id="loginEmail" placeholder="तुमचा Gmail पत्ता" autocomplete="username" />
      <input type="password" id="loginPassword" placeholder="पासवर्ड" autocomplete="current-password" />
      <button type="button" id="emailLoginBtn" class="primary">ईमेल/पासवर्डने लॉगिन करा</button>
      <button type="button" id="googleLoginBtn" class="success">Google Sign-In</button>
      <button type="button" id="forgotPassBtn" class="sm" style="background:transparent; border:none; color:var(--accent); text-decoration:underline;">🔑 पासवर्ड विसरलात? (Forgot Password)</button>
      <div id="authMsg" class="muted" style="text-align:center;"></div>
    </div>
  </section>

  <!-- मुख्य अ‍ॅप शेल -->
  <div id="appShell" class="hidden">
    <header class="app-header">
      <div class="header-left">
        <button type="button" id="menuOpenBtn" class="ham-btn" aria-label="मुख्य मेन्यू">
          <span></span><span></span><span></span>
        </button>
        <span id="brandTitleText" class="header-brand">व्याज हिशोब वही</span>
        <span id="netBadge" class="badge paid">Online 🟢</span>
        <span id="syncBadge" class="badge">Synced</span>
      </div>
      <div class="header-right">
        <button type="button" id="headerBellBtn" class="sm" title="रिमाइंडर व 10/4/6 Push">
          🔔 <span id="bellCountPill" class="badge pending" style="padding:0 5px;">0</span>
        </button>
      </div>
    </header>

    <!-- साइडबार ड्रॉवर -->
    <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
    <aside id="sideDrawer" class="side-drawer hidden"></aside>

    <!-- मुख्य कंटेंट (Dashboard + 4-Tab Borrowers) -->
    <main class="container">
      <div id="dashboardRoot"></div>
      <div id="borrowersRoot"></div>
    </main>

    <!-- फ्लोटिंग नवीन ग्राहक बटण -->
    <button type="button" id="fabNewBorrower" class="fab-new">➕ New</button>

    <!-- बॉटम नेव्हिगेशन -->
    <nav class="bottom-nav">
      <button type="button" id="navHomeBtn" class="is-active"><span class="bn-ic">🏠</span><span>Home</span></button>
      <button type="button" id="navMonthsBtn"><span class="bn-ic">📅</span><span>Months</span></button>
      <button type="button" id="navCashbookBtn"><span class="bn-ic">📒</span><span>कॅशबुक</span></button>
      <button type="button" id="navPayBtn"><span class="bn-ic">⚡</span><span>Pay</span></button>
    </nav>
  </div>

  <!-- आधुनिक ES Module एंट्री पॉईंट -->
  <script type="module" src="./src/main.js?v=2.0"></script>
</body>
</html>
