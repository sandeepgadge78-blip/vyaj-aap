<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://sandeepgadge78-blip.github.io; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://docs.google.com https://*.googleusercontent.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com;" />
  <title>Hishob — व्याज व कर्ज हिशोब (V12.0)</title>

  <link rel="manifest" href="manifest.json" />

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --card-2: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 64px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .brand { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--accent);
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, input, select {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
    }
    button { cursor: pointer; font-weight: 600; transition: 0.15s; }
    button:hover { border-color: var(--accent); }
    button.primary { background: #0284c7; border-color: #0ea5e9; color: #fff; }
    button.success { background: #15803d; border-color: #22c55e; color: #fff; }
    button.danger { background: #991b1b; border-color: #ef4444; color: #fff; }
    button.warn { background: #92400e; border-color: #f59e0b; color: #fff; }
    .container { max-width: 980px; margin: 16px auto; padding: 0 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .borrower-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      background: rgba(30, 41, 59, 0.45);
    }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .ok { color: var(--accent-2); }
    .err { color: var(--danger); }
    .audit-box {
      max-height: 220px;
      overflow-y: auto;
      font-size: 0.82rem;
      background: var(--bg);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    #authScreen {
      max-width: 420px;
      margin: 48px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Hishob V12.0</span>
      <span id="syncStatus" class="badge">Offline / Ready</span>
    </div>
    <div id="topActions" class="row hidden">
      <span id="userEmailBadge" class="muted"></span>
      <button id="lockBtn" class="danger" title="लॉक व साइन-आउट">🔒 लॉक / लॉगआउट</button>
    </div>
  </header>

  <div id="authScreen">
    <h2 style="margin-top:0;">व्याज हिशोब लॉगिन</h2>
    <p class="muted">केवळ अधिकृत खात्यासाठी सुरक्षित प्रवेश.</p>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <input type="email" id="loginEmail" placeholder="तुमचा Gmail पत्ता" autocomplete="username" />
      <input type="password" id="loginPassword" placeholder="पासवर्ड" autocomplete="current-password" />
      <button id="emailLoginBtn" class="primary">ईमेल/पासवर्डने लॉगिन करा</button>
      <button id="googleLoginBtn" class="success">Google Sign-In</button>
      <div id="authMsg" class="muted"></div>
    </div>
  </div>

  <main id="appScreen" class="container hidden">

    <section class="card">
      <h3 style="margin-top:0;">नवीन ग्राहक / कर्ज नोंद</h3>
      <div class="grid-3">
        <input type="text" id="bName" placeholder="ग्राहकाचे नाव" />
        <input type="number" id="bPrincipal" placeholder="मुद्दल रक्कम (₹)" min="0" />
        <input type="number" id="bRate" placeholder="मासिक व्याज दर (%)" step="0.1" value="2" />
        <input type="month" id="bStartYm" />
        <input type="number" id="bCustomDue" placeholder="सुरुवातीची मॅन्युअल मागील बाकी (₹)" min="0" />
      </div>
      <div style="margin-top:10px;">
        <button id="addBorrowerBtn" class="primary">+ ग्राहक जोडा</button>
      </div>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between;">
        <h3 style="margin:0;">मासिक हिशोब व जमा नोंद</h3>
        <div class="row">
          <label class="muted">हिशोब महिना:</label>
          <input type="month" id="activeYm" />
        </div>
      </div>
      <div id="borrowersList"></div>
    </section>

    <section class="card">
      <h3 style="margin-top:0;">Google Sheet Import व Encrypted Backup</h3>
      <div class="row" style="margin-bottom:10px;">
        <input type="text" id="sheetUrlInput" placeholder="Google Sheet CSV / Export URL किंवा Sheet ID" style="flex:1; min-width:220px;" />
        <button id="importSheetBtn" class="primary">Sheet Import</button>
      </div>
      <div class="row">
        <input type="password" id="backupPasskey" placeholder="मजबूत Passkey (किमान 6 अक्षरे)" />
        <button id="exportEncBtn" class="success">Encrypted Backup Export</button>
        <input type="file" id="importEncFile" accept=".json,.txt" />
        <button id="importEncBtn">Encrypted Restore</button>
      </div>
      <div id="ioMsg" class="muted" style="margin-top:8px;"></div>
    </section>

    <section class="card">
      <h3 style="margin-top:0;">Audit Log (केवळ नवीन नोंद)</h3>
      <div id="auditList" class="audit-box"></div>
    </section>

  </main>

  <script>
    // १. Hishob (hishob-4b548) साठी अचूक Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDYpC1Pdm9jDtmNlT2J6BOPzk88QvBo8ds",
      authDomain: "hishob-4b548.firebaseapp.com",
      projectId: "hishob-4b548",
      storageBucket: "hishob-4b548.firebasestorage.app",
      messagingSenderId: "528801714157",
      appId: "1:528801714157:web:c7e43ad3b05203b87be1e4",
      measurementId: "G-RH91B88LZB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    async function ensurePersistenceEnabled() {
      try {
        await db.enablePersistence({ synchronizeTabs: true });
      } catch (_) {
        // अनेक टॅब किंवा खाजगी ब्राउझिंगमध्ये आधीच चालू असल्यास सुरक्षितपणे पुढे जा
      }
    }
    ensurePersistenceEnabled();

    // २. अ‍ॅप स्टेट
    const state = {
      user: null,
      borrowers: [],
      auditLogs: [],
      unsubscribeBorrowers: null,
      unsubscribeAudit: null
    };

    const currentYmDefault = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    };

    document.getElementById('bStartYm').value = currentYmDefault();
    document.getElementById('activeYm').value = currentYmDefault();

    // ३. Safe Chunked Base64 Helpers
    function uint8ToBase64(bytes) {
      let binary = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode.apply(null, chunk);
      }
      return btoa(binary);
    }

    function base64ToUint8(base64Str) {
      const binary = atob(base64Str);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    // ४. Web Crypto AES-GCM Encryption (युजरने दिलेली Passkey अनिवार्य)
    async function deriveAesKey(passkey, saltBytes) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        enc.encode(passkey),
        'PBKDF2',
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: saltBytes,
          iterations: 150000,
          hash: 'SHA-256'
        },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encryptPayload(obj, passkey) {
      if (!passkey || passkey.trim().length < 6) {
        throw new Error('कृपया किमान ६ अक्षरांची मजबूत Passkey टाका.');
      }
      const enc = new TextEncoder();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const aesKey = await deriveAesKey(passkey, salt);
      const plainBytes = enc.encode(JSON.stringify(obj));
      const cipherBuffer = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, plainBytes);

      return JSON.stringify({
        v: 12,
        salt: uint8ToBase64(salt),
        iv: uint8ToBase64(iv),
        data: uint8ToBase64(new Uint8Array(cipherBuffer))
      });
    }

    async function decryptPayload(jsonText, passkey) {
      if (!passkey || passkey.trim().length < 6) {
        throw new Error('डिक्रिप्ट करण्यासाठी योग्य Passkey टाका.');
      }
      const parsed = JSON.parse(jsonText);
      const salt = base64ToUint8(parsed.salt);
      const iv = base64ToUint8(parsed.iv);
      const cipherBytes = base64ToUint8(parsed.data);
      const aesKey = await deriveAesKey(passkey, salt);
      const plainBuffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, cipherBytes);
      return JSON.parse(new TextDecoder().decode(plainBuffer));
    }

    // ५. Audit Log (Append-Only)
    async function appendAuditLog(action, details) {
      if (!state.user) return;
      const entry = {
        action,
        details,
        by: state.user.email || state.user.uid,
        ts: new Date().toISOString()
      };
      try {
        await db
          .collection('users')
          .doc(state.user.uid)
          .collection('auditLogs')
          .add(entry);
      } catch (e) {
        console.warn('Audit log write warning:', e.message);
      }
    }

    // ६. मॅन्युअल "मागील बाकी" आणि मासिक हिशोब गणित (computeLedgerUpToMonth)
    function compareYm(a, b) {
      return String(a || '').localeCompare(String(b || ''));
    }

    function nextYm(ym) {
      const [y, m] = ym.split('-').map(Number);
      if (m === 12) return `${y + 1}-01`;
      return `${y}-${String(m + 1).padStart(2, '0')}`;
    }

    function computeLedgerUpToMonth(borrower, targetYm) {
      const principal = Number(borrower.principal || 0);
      const rate = Number(borrower.rate || 0);
      const paidMonths = borrower.paidMonths || {};
      const customPastDues = borrower.customPastDues || {};
      const customCashPaid = borrower.customCashPaid || {};

      let runningPastDue = 0;
      let cursor = borrower.startYm || targetYm;
      let guard = 0;

      while (compareYm(cursor, targetYm) <= 0 && guard < 240) {
        guard++;
        const monthlyInterest = Math.round((principal * rate) / 100);
        const isPaid = Boolean(paidMonths[cursor]);

        if (Object.prototype.hasOwnProperty.call(customPastDues, cursor)) {
          runningPastDue += Number(customPastDues[cursor] || 0);
        }

        if (Object.prototype.hasOwnProperty.call(customCashPaid, cursor)) {
          runningPastDue = Math.max(0, runningPastDue - Number(customCashPaid[cursor] || 0));
        }

        if (cursor === targetYm) {
          const currentDue = isPaid ? 0 : monthlyInterest;
          const totalPayable = Math.max(0, runningPastDue) + currentDue;
          return {
            principal,
            monthlyInterest,
            isPaid,
            pastDue: Math.max(0, runningPastDue),
            totalPayable
          };
        }

        if (!isPaid) {
          runningPastDue += monthlyInterest;
        }

        cursor = nextYm(cursor);
      }

      const monthlyInterest = Math.round((principal * rate) / 100);
      const isPaid = Boolean(paidMonths[targetYm]);
      return {
        principal,
        monthlyInterest,
        isPaid,
        pastDue: Math.max(0, runningPastDue),
        totalPayable: Math.max(0, runningPastDue) + (isPaid ? 0 : monthlyInterest)
      };
    }

    // ७. हप्ता जमा/रद्द करणे (FieldValue.delete() वापरून रद्द केलेली नोंद पुन्हा येऊ नये याची खात्री)
    async function toggleMonthPayment(borrowerId, ym, currentlyPaid) {
      if (!state.user) return;
      const docRef = db
        .collection('users')
        .doc(state.user.uid)
        .collection('borrowers')
        .doc(borrowerId);

      if (currentlyPaid) {
        await docRef.update({
          [`paidMonths.${ym}`]: firebase.firestore.FieldValue.delete()
        });
        await appendAuditLog('PAYMENT_CANCELLED', `${borrowerId} साठी ${ym} चा हप्ता रद्द केला`);
      } else {
        await docRef.update({
          [`paidMonths.${ym}`]: {
            paidAt: new Date().toISOString()
          }
        });
        await appendAuditLog('PAYMENT_MARKED', `${borrowerId} साठी ${ym} चा हप्ता जमा केला`);
      }
    }

    // मॅन्युअल मागील बाकी भरल्यावर (जमा केल्यावर) कपात करणे
    async function payCustomPastDue(borrowerId, ym, currentPastDue) {
      if (!state.user) return;
      const inputEl = document.getElementById(`payPastInput_${borrowerId}`);
      const amountToPay = Number(inputEl ? inputEl.value : 0);
      if (!amountToPay || amountToPay <= 0) {
        alert('कृपया जमा करायची रक्कम (₹) टाका.');
        return;
      }

      const docRef = db
        .collection('users')
        .doc(state.user.uid)
        .collection('borrowers')
        .doc(borrowerId);

      const existingBorrower = state.borrowers.find(b => b.id === borrowerId) || {};
      const prevCashPaid = Number((existingBorrower.customCashPaid && existingBorrower.customCashPaid[ym]) || 0);
      const newPastDue = Math.max(0, Number(currentPastDue || 0) - amountToPay);

      const updatePayload = {
        [`customCashPaid.${ym}`]: prevCashPaid + amountToPay
      };

      if (newPastDue === 0 && existingBorrower.customPastDues && Object.prototype.hasOwnProperty.call(existingBorrower.customPastDues, ym)) {
        updatePayload[`customPastDues.${ym}`] = firebase.firestore.FieldValue.delete();
      }

      await docRef.update(updatePayload);
      if (inputEl) inputEl.value = '';
      await appendAuditLog('PAST_DUE_PAID', `${borrowerId} (${ym}) मधून ₹${amountToPay} जमा केले; उरलेली बाकी ₹${newPastDue}`);
    }

    // मॅन्युअल बाकी नोंद रद्द/काढून टाकणे (FieldValue.delete())
    async function clearManualPastDueForMonth(borrowerId, ym) {
      if (!state.user) return;
      const docRef = db
        .collection('users')
        .doc(state.user.uid)
        .collection('borrowers')
        .doc(borrowerId);

      await docRef.update({
        [`customPastDues.${ym}`]: firebase.firestore.FieldValue.delete(),
        [`customCashPaid.${ym}`]: firebase.firestore.FieldValue.delete()
      });
      await appendAuditLog('MANUAL_DUE_REMOVED', `${borrowerId} (${ym}) ची मॅन्युअल बाकी नोंद काढून टाकली`);
    }

    // ८. Safe CSV Line Parser (डबल-कोट्स व कॉमा हाताळण्यासाठी)
    function parseCsvLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    // ९. UI Render
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function renderBorrowers() {
      const container = document.getElementById('borrowersList');
      const activeYm = document.getElementById('activeYm').value || currentYmDefault();

      if (!state.borrowers.length) {
        container.innerHTML = '<p class="muted">अद्याप कोणतीही कर्ज/व्याज नोंद नाही.</p>';
        return;
      }

      container.innerHTML = state.borrowers.map(b => {
        const calc = computeLedgerUpToMonth(b, activeYm);
        return `
          <div class="borrower-item">
            <div class="row" style="justify-content:space-between;">
              <div>
                <strong>${escapeHtml(b.name || 'नाव नाही')}</strong>
                <span class="badge">मुद्दल: ₹${calc.principal}</span>
                <span class="badge">दर: ${b.rate || 0}%</span>
              </div>
              <div class="badge">${calc.isPaid ? 'हप्ता जमा' : 'थकबाकी / प्रलंबित'}</div>
            </div>
            <div style="margin-top:8px;" class="row">
              <span>मागील बाकी (${activeYm}): <strong>₹${calc.pastDue}</strong></span>
              <span>चालू महिना व्याज: <strong>₹${calc.monthlyInterest}</strong></span>
              <span>एकूण देणे: <strong class="ok">₹${calc.totalPayable}</strong></span>
            </div>
            <div style="margin-top:10px;" class="row">
              <button onclick="window.__togglePay('${b.id}', '${activeYm}', ${calc.isPaid})" class="${calc.isPaid ? 'danger' : 'success'}">
                ${calc.isPaid ? 'हप्ता रद्द करा' : 'चालू हप्ता जमा करा'}
              </button>
              <input type="number" id="payPastInput_${b.id}" placeholder="मागील बाकी जमा (₹)" min="1" style="width:170px;" />
              <button onclick="window.__payPast('${b.id}', '${activeYm}', ${calc.pastDue})" class="primary">
                मागील बाकी कपात करा
              </button>
              <button onclick="window.__clearManualDue('${b.id}', '${activeYm}')" class="warn">
                मॅन्युअल बाकी काढा
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAuditLogs() {
      const box = document.getElementById('auditList');
      if (!state.auditLogs.length) {
        box.innerHTML = '<div class="muted">कोणत्याही Audit नोंदी नाहीत.</div>';
        return;
      }
      box.innerHTML = state.auditLogs.map(log => `
        <div style="padding:4px 0; border-bottom:1px solid #1e293b;">
          <span class="muted">[${escapeHtml(log.ts || '')}]</span>
          <strong>${escapeHtml(log.action || '')}</strong> — ${escapeHtml(log.details || '')}
        </div>
      `).join('');
    }

    window.__togglePay = toggleMonthPayment;
    window.__payPast = payCustomPastDue;
    window.__clearManualDue = clearManualPastDueForMonth;

    // १०. नवीन ग्राहक जोडणे
    document.getElementById('addBorrowerBtn').addEventListener('click', async () => {
      if (!state.user) return;
      const name = document.getElementById('bName').value.trim();
      const principal = Number(document.getElementById('bPrincipal').value || 0);
      const rate = Number(document.getElementById('bRate').value || 0);
      const startYm = document.getElementById('bStartYm').value || currentYmDefault();
      const customDue = Number(document.getElementById('bCustomDue').value || 0);

      if (!name || principal <= 0) {
        alert('कृपया ग्राहकाचे नाव आणि मुद्दल रक्कम टाका.');
        return;
      }

      const payload = {
        name,
        principal,
        rate,
        startYm,
        paidMonths: {},
        customPastDues: customDue > 0 ? { [startYm]: customDue } : {},
        customCashPaid: {},
        createdAt: new Date().toISOString()
      };

      await db.collection('users').doc(state.user.uid).collection('borrowers').add(payload);
      await appendAuditLog('BORROWER_ADDED', `${name} (मुद्दल ₹${principal}, सुरू ${startYm})`);

      document.getElementById('bName').value = '';
      document.getElementById('bPrincipal').value = '';
      document.getElementById('bCustomDue').value = '';
    });

    document.getElementById('activeYm').addEventListener('change', renderBorrowers);

    // ११. Google Sheet Import
    document.getElementById('importSheetBtn').addEventListener('click', async () => {
      const msgEl = document.getElementById('ioMsg');
      const raw = document.getElementById('sheetUrlInput').value.trim();
      if (!raw || !state.user) {
        msgEl.textContent = 'कृपया Google Sheet URL किंवा ID टाका.';
        return;
      }

      let fetchUrl = raw;
      const idMatch = raw.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (idMatch) {
        fetchUrl = `https://docs.google.com/spreadsheets/d/${idMatch[1]}/export?format=csv`;
      } else if (/^[a-zA-Z0-9-_]{20,}$/.test(raw)) {
        fetchUrl = `https://docs.google.com/spreadsheets/d/${raw}/export?format=csv`;
      }

      try {
        msgEl.textContent = 'Google Sheet मधून डेटा वाचत आहे...';
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const csvText = await res.text();
        const lines = csvText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        let importedCount = 0;

        for (let i = 1; i < lines.length; i++) {
          const cols = parseCsvLine(lines[i]);
          const name = cols[0];
          const principal = Number(cols[1] || 0);
          const rate = Number(cols[2] || 2);
          const startYm = cols[3] || currentYmDefault();
          if (name && principal > 0) {
            await db.collection('users').doc(state.user.uid).collection('borrowers').add({
              name,
              principal,
              rate,
              startYm,
              paidMonths: {},
              customPastDues: {},
              customCashPaid: {},
              importedFromSheet: true,
              createdAt: new Date().toISOString()
            });
            importedCount++;
          }
        }
        await appendAuditLog('SHEET_IMPORT', `${importedCount} नोंदी Sheet मधून आयात केल्या`);
        msgEl.textContent = `${importedCount} नोंदी यशस्वीरीत्या आयात झाल्या.`;
      } catch (err) {
        msgEl.textContent = `Sheet Import एरर: ${err.message} (Sheet 'Anyone with the link can view' असल्याची खात्री करा).`;
      }
    });

    // १२. Encrypted Export & Restore
    document.getElementById('exportEncBtn').addEventListener('click', async () => {
      const msgEl = document.getElementById('ioMsg');
      const passkey = document.getElementById('backupPasskey').value;
      try {
        const bundle = {
          exportedAt: new Date().toISOString(),
          borrowers: state.borrowers
        };
        const encryptedStr = await encryptPayload(bundle, passkey);
        const blob = new Blob([encryptedStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `hishob-backup-${currentYmDefault()}.enc.json`;
        a.click();
        URL.revokeObjectURL(url);
        msgEl.textContent = 'Encrypted बॅकअप फाईल तयार झाली.';
      } catch (err) {
        msgEl.textContent = `बॅकअप एरर: ${err.message}`;
      }
    });

    document.getElementById('importEncBtn').addEventListener('click', async () => {
      const msgEl = document.getElementById('ioMsg');
      const passkey = document.getElementById('backupPasskey').value;
      const fileInput = document.getElementById('importEncFile');
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        msgEl.textContent = 'कृपया बॅकअप फाईल निवडा.';
        return;
      }
      try {
        const text = await file.text();
        const restored = await decryptPayload(text, passkey);
        const list = Array.isArray(restored.borrowers) ? restored.borrowers : [];
        for (const item of list) {
          const cleanCopy = { ...item };
          delete cleanCopy.id;
          await db.collection('users').doc(state.user.uid).collection('borrowers').add(cleanCopy);
        }
        await appendAuditLog('ENCRYPTED_RESTORE', `${list.length} नोंदी रिस्टोर केल्या`);
        msgEl.textContent = `${list.length} नोंदी यशस्वीरीत्या रिस्टोर झाल्या.`;
      } catch (err) {
        msgEl.textContent = `रिस्टोर एरर: ${err.message}`;
      }
    });

    // १३. Login, खरा Lock (auth.signOut()) व IndexedDB + Audit Cache साफ करणे
    document.getElementById('emailLoginBtn').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;
      const msg = document.getElementById('authMsg');
      msg.textContent = 'लॉगिन होत आहे...';
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        msg.textContent = '';
      } catch (e) {
        msg.textContent = `लॉगिन अयशस्वी: ${e.message}`;
      }
    });

    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      const msg = document.getElementById('authMsg');
      msg.textContent = 'Google Login सुरू आहे...';
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        msg.textContent = '';
      } catch (e) {
        msg.textContent = `Google Login एरर: ${e.message}`;
      }
    });

    async function performFullLockAndLogout() {
      if (typeof state.unsubscribeBorrowers === 'function') {
        state.unsubscribeBorrowers();
        state.unsubscribeBorrowers = null;
      }
      if (typeof state.unsubscribeAudit === 'function') {
        state.unsubscribeAudit();
        state.unsubscribeAudit = null;
      }
      state.borrowers = [];
      state.auditLogs = [];

      try {
        await auth.signOut();
      } catch (e) {
        console.warn('SignOut error:', e);
      }

      try {
        localStorage.removeItem('vyaj_v11_audit');
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith('vyaj_') || k.startsWith('hishob_')) {
            localStorage.removeItem(k);
          }
        });
        sessionStorage.clear();
      } catch (e) {
        console.warn('Storage clear warning:', e);
      }

      try {
        await db.terminate();
        await db.clearPersistence();
      } catch (e) {
        console.warn('Firestore persistence clear warning:', e);
      }

      // डेटाबेस पुन्हा नव्याने सुरू होण्यासाठी पेज रीलोड करणे आवश्यक आहे
      window.location.reload();
    }

    document.getElementById('lockBtn').addEventListener('click', performFullLockAndLogout);

    // १४. Auth State Listener
    auth.onAuthStateChanged(async (user) => {
      const authScreen = document.getElementById('authScreen');
      const appScreen = document.getElementById('appScreen');
      const topActions = document.getElementById('topActions');
      const badge = document.getElementById('syncStatus');
      const emailBadge = document.getElementById('userEmailBadge');

      if (typeof state.unsubscribeBorrowers === 'function') {
        state.unsubscribeBorrowers();
        state.unsubscribeBorrowers = null;
      }
      if (typeof state.unsubscribeAudit === 'function') {
        state.unsubscribeAudit();
        state.unsubscribeAudit = null;
      }

      if (!user) {
        state.user = null;
        state.borrowers = [];
        state.auditLogs = [];
        authScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
        topActions.classList.add('hidden');
        badge.textContent = 'Locked / Signed Out';
        return;
      }

      await ensurePersistenceEnabled();

      state.user = user;
      authScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      topActions.classList.remove('hidden');
      emailBadge.textContent = user.email || '';
      badge.textContent = 'Live Synced';

      const userRoot = db.collection('users').doc(user.uid);

      state.unsubscribeBorrowers = userRoot.collection('borrowers').onSnapshot(
        (snap) => {
          state.borrowers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderBorrowers();
        },
        (err) => {
          badge.textContent = 'Sync Error';
          console.error('Borrowers snapshot error:', err);
        }
      );

      state.unsubscribeAudit = userRoot.collection('auditLogs')
        .orderBy('ts', 'desc')
        .limit(50)
        .onSnapshot(
          (snap) => {
            state.auditLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderAuditLogs();
          },
          () => {
            userRoot.collection('auditLogs').limit(50).get().then(snap => {
              state.auditLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
              renderAuditLogs();
            }).catch(() => {});
          }
        );
    });
  </script>
</body>
</html>
